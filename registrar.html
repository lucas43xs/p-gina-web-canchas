<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta author="author" content="Martiniano E Diele Lucas Prado">
    <link rel="stylesheet" href="estiloregistro.css">
    <title>Prado</title>
</head>

<body>
    <header>
        <a href="canchas.html"><img src="imagenes\logo.png" alt="Logotipo"> </a>
        <div class="contactanos">
            <a href="iniciar.html"><h3>Iniciar Sesion</h3></a>
        </div>

        <div class="menu">
            <a href="canchas.html"><h3>Volver a Menu</h3></a>
        </div>
    </header>

    <div class="contenedor">
        <div class="registro">
            <h2>REGISTRATE A NUESTRA PAGINA </h2>
        </div>

        <form action="#" method="POST">
            <h2>Registro de Usuario</h2>

            <div class="campo">
                <label for="apellido">Ingrese su Nombre y Apellido:</label>
                <input type="text" id="apellido" name="apellido" required>
            </div>

            <div class="campo">
                <label for="correo">Ingrese su Correo:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="campo">
                <label for="contrasena">Ingrese su Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" placeholder="Escriba contraseña" required>
            </div>

            <div class="botones">
                <a href="canchas.html" class="boton-enviar">Enviar</a>
            </div>  
        </form>

    </div>

    <footer>
    
    </footer>

</body>

</html>
